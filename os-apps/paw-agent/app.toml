name = "paw-agent"
description = "Core agent lifecycle — souls, skills, sessions, memory, teams"
version = "0.1.0"
startup_install = "core"
dependencies = ["paw-fs"]

[[wasm_modules]]
name = "workspace_provisioner"
criticality = "app-required"
startup_loading = "eager"

[[wasm_modules]]
name = "context_preparer"
criticality = "app-required"
startup_loading = "eager"

[[wasm_modules]]
name = "provider_auth_gate"
criticality = "app-required"
startup_loading = "eager"

[[wasm_modules]]
name = "openai_codex_auth"
criticality = "app-required"
startup_loading = "lazy"

[[wasm_modules]]
name = "provider_caller"
criticality = "app-required"
startup_loading = "eager"

[[wasm_modules]]
name = "provider_response_applier"
criticality = "app-required"
startup_loading = "eager"

[[wasm_modules]]
name = "agent_reply"
criticality = "app-required"
startup_loading = "eager"

[[wasm_modules]]
name = "emit_ots_trajectory"
criticality = "app-required"
startup_loading = "eager"

[[wasm_modules]]
name = "monty_repl"
target = "wasm32-wasip1"
criticality = "app-required"
startup_loading = "lazy"
provenance = "bundled-artifact"
import_class = "temper-host+wasi-preview1"

[[wasm_modules]]
name = "session_link_monitor"
criticality = "app-required"
startup_loading = "lazy"

[[wasm_modules]]
name = "session_recoverer"
criticality = "app-required"
startup_loading = "lazy"

[[wasm_modules]]
name = "plan_approval_handler"
criticality = "app-required"
startup_loading = "lazy"

[wasm_modules.data]
operations = ["entity_get", "action_invoke"]

[[wasm_modules.data.entities]]
type = "TemperPaw.Session"
actions = ["ResumeWithPlanApproval"]

[wasm_modules.data.budgets]
max_calls = 2
max_batch_items = 1
max_page_items = 1
max_request_bytes = 65536
max_response_bytes = 1048576
max_open_responses = 1
max_open_streams = 1
max_stream_bytes = 1
