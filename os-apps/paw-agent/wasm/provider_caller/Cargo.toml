[package]
name = "provider-caller"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[workspace]

[dependencies]
temper-wasm-sdk = { git = "https://github.com/nikstern/temper.git", rev = "f0c431ed0b2a19e3f7834a95cba884ad15085651" }
session-tree-lib = { path = "../session-tree-lib" }
session-turn-artifacts = { path = "../session-turn-artifacts" }
wasm-helpers = { path = "../wasm-helpers" }
openai-codex-wire = { path = "../openai-codex-wire" }
openai-chat-wire = { path = "../openai-chat-wire" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
