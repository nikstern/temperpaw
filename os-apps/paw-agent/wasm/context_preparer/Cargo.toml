[package]
name = "context-preparer"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[workspace]

[dependencies]
temper-wasm-sdk = { git = "https://github.com/nikstern/temper.git", rev = "fa1c4a594f4398c1570a3b3469cadd06efcb5043" }
session-tree-lib = { path = "../session-tree-lib" }
session-turn-artifacts = { path = "../session-turn-artifacts" }
tool-catalog = { path = "../tool-catalog" }
wasm-helpers = { path = "../wasm-helpers" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
